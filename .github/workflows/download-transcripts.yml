name: Download Transcripts

# Manual only (no push or schedule trigger). Downloads a few transcripts on a GitHub runner so you can see whether
# YouTube lets them through: GitHub's addresses are blocked, so this can go through your Webshare proxy and/or
# YouTube cookies (yt-dlp only). Nothing is committed: transcripts are git-ignored, they are uploaded as an artifact.
# The secrets are the encrypted `proxy` and `cookies` profiles in fnox.toml (`mise run local:proxy:setup`,
# `mise run local:cookies:setup`); the one repository secret FNOX_AGE_KEY decrypts them. The network picks the same
# fnox profiles as locally (FNOX_PROFILE=proxy,cookies), so local, act and GitHub read the same values.
on:
  workflow_dispatch:
    inputs:
      network:
        description: How to reach YouTube
        type: choice
        options: [direct, proxy, cookies, proxy+cookies]
        default: proxy
      method:
        description: Transcript method
        type: choice
        options: [ytdlp, youtube_transcript_api]
        default: ytdlp
      limit:
        description: Stop after this many transcripts
        type: string
        default: '3'

concurrency:
  group: transcripts-download   # it writes nothing to the repository, so it may run beside the video workflows
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-latest
    env:
      MISE_DISABLE_TOOLS: act,gh,gcloud,tilt,age  # local-only tools; fnox is kept because tasks run via `fnox exec`
      FNOX_AGE_KEY: ${{ secrets.FNOX_AGE_KEY }}  # the `ci` age key: fnox decrypts the secrets in fnox.toml with it
      NETWORK: ${{ inputs.network || 'proxy' }}
      METHOD: ${{ inputs.method || 'ytdlp' }}
      LIMIT: ${{ inputs.limit || '3' }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up mise (python, uv)
      uses: jdx/mise-action@v2

    - name: Install dependencies
      run: mise run setup:cli

    - name: Unlock the secrets of the chosen network (${{ env.NETWORK }})
      run: |
        case "$NETWORK" in
          direct) profile=""; names="" ;;
          proxy) profile="proxy"; names="PROXY_URL WEBSHARE_PROXY_USERNAME WEBSHARE_PROXY_PASSWORD" ;;
          cookies) profile="cookies"; names="YTDLP_COOKIES_BASE64" ;;
          proxy+cookies) profile="proxy,cookies"; names="PROXY_URL WEBSHARE_PROXY_USERNAME WEBSHARE_PROXY_PASSWORD YTDLP_COOKIES_BASE64" ;;
          *) echo "::error::unknown network '$NETWORK'"; exit 1 ;;
        esac
        echo "FNOX_PROFILE=$profile" >> "$GITHUB_ENV"   # the same profiles as locally: mise run local:profile:use -- proxy cookies
        if [ -z "$names" ]; then echo "Going direct: expect YouTube to block GitHub's address."; exit 0; fi
        FNOX_PROFILE="$profile" scripts/ci_unlock.sh $names

    - name: Download transcripts (${{ env.METHOD }}, up to ${{ env.LIMIT }}, network ${{ env.NETWORK }})
      run: mise run local:transcripts:manage -- --method "$METHOD" download-missing --limit "$LIMIT"

    - name: Summary
      if: always()
      run: |
        {
          echo "### Transcripts: $METHOD, network $NETWORK, limit $LIMIT"
          echo '```'
          mise run local:transcripts:manage -- stats 2>&1 | tail -3 || true
          ls -l data/transcripts 2>/dev/null | tail -n +2 | awk '{print $5, $9}' | head -20 || true
          echo '```'
        } >> "${GITHUB_STEP_SUMMARY:-/dev/stdout}"

    - name: Upload transcripts and log
      if: always() && !env.ACT
      uses: actions/upload-artifact@v4
      with:
        name: transcripts-${{ github.run_number }}
        path: |
          data/transcripts/
          logs/transcripts.log
        if-no-files-found: ignore
        retention-days: 7
