# Task names: <where>:<area>:<action>
#   local: run the code directly on this machine
#   act:   run the GitHub workflow locally in Docker via act (never commits/pushes/creates issues)
#   gh:    trigger the REAL workflow on GitHub (it commits, pushes and opens/comments on issues)

[tools]
python = "3.12"
uv = "latest"
act = "latest"
fnox = "latest"
gh = "latest"
gcloud = "latest"

[env]
# gcloud's installer needs Python 3.10+; use mise's Python instead of the macOS system one
CLOUDSDK_PYTHON = "{{ get_env(name='MISE_DATA_DIR', default=env.HOME ~ '/.local/share/mise') }}/installs/python/3.12/bin/python"

[tasks.install]
description = "Full first-time setup: install tools (incl. gcloud), sync Python deps, check Docker (offers to install it)"
depends = ["setup"]
run = ["scripts/ensure_gcloud.sh", "scripts/check_docker.sh"]

[tasks.nuke]
description = "Opposite of install: remove .venv, .act, Docker containers/volumes/image for this project (flags: --all, --yes, --dry-run; e.g. `mise run nuke -- --dry-run`)"
run = "scripts/nuke.sh"

[tasks.menu]
description = "Interactive terminal UI: pick where to run (local/act/gh), what to run and its options"
run = "uv run seeker-tui"
interactive = true

[tasks.test]
description = "Run all tests (SDKs, CLI, and the TUI flows with Textual's headless pilot)"
run = "uv run pytest"

[tasks."build:sdks"]
description = "Build every SDK in sdks/ as its own wheel (seeker_sdk_*.whl) into dist/sdks and verify them in clean venvs (flags after --: --sdist, --no-verify)"
run = "scripts/build_packages.sh sdks"

[tasks."build:apps"]
description = "Build the apps (seeker-cli, seeker-tui) as wheels into dist/apps and verify them (flags after --: --sdist, --no-verify)"
run = "scripts/build_packages.sh apps"

[tasks."sdk:new"]
description = "Scaffold a new SDK: `mise run sdk:new -- rag [--plugin video_sources|transcript_methods]`"
run = "uv run python scripts/new_sdk.py"

[tasks.setup]
description = "Install Python dependencies into .venv"
run = "uv sync --all-packages"

# ---- local: run the scripts directly -------------------------------------

[tasks."local:apikey:setup"]
description = "[local] Guided YouTube API key setup: opens the console, validates your key, saves it to fnox.local.toml (optionally to the GitHub secret)"
run = "scripts/api_key.sh"

[tasks."local:videos:update"]
description = "[local] Fetch new videos and update data/videos_master.json"
run = "fnox exec -- uv run seeker videos update"

[tasks."local:videos:rebuild"]
description = "[local] Rebuild the master list from scratch"
run = "fnox exec -- uv run seeker videos rebuild --force"

[tasks."local:videos:manage"]
description = "[local] Manage/categorize videos (pass a subcommand, e.g. `mise run local:videos:manage report`)"
run = "fnox exec -- uv run seeker videos manage"

[tasks."local:transcripts:manage"]
description = "[local] Download/manage transcripts (e.g. `mise run local:transcripts:manage -- --method ytdlp download-missing --limit 5`; subcommands: stats, list-missing, download-missing, download, check)"
run = "fnox exec -- uv run seeker transcripts"

[tasks."local:method:set"]
description = "[local] Set a method in fnox.local.toml: `mise run local:method:set -- master-list ytdlp|youtube_api|unset` or `-- transcript ytdlp|youtube_transcript_api|unset`"
run = "scripts/method.sh local set"

[tasks."local:method:show"]
description = "[local] Show the methods set in fnox.local.toml"
run = "scripts/method.sh local show"

[tasks."local:transcripts:compare"]
description = "[local] Download one video's transcript with BOTH methods side by side: `mise run local:transcripts:compare -- VIDEO_ID` (files under data/transcripts/compare/<id>/)"
run = "fnox exec -- uv run seeker transcripts compare"

# ---- act: run the workflows locally in Docker ----------------------------

[tasks."docker:start"]
description = "[docker] Start Docker Desktop if installed and wait until ready"
run = "scripts/docker.sh start"

[tasks."docker:stop"]
description = "[docker] Remove this project's containers/volumes, then quit Docker Desktop to free resources"
run = "scripts/docker.sh stop"

[tasks."docker:diagnose"]
description = "[docker] Show host vs Docker allocated/free CPU, memory, disk, and how to change it permanently (read-only)"
run = "scripts/docker_diagnose.sh"

[tasks."docker:cleanup"]
description = "[docker] Remove leftover (orphaned) containers/volumes from this project, keep Docker running"
run = "scripts/docker.sh cleanup"

[tasks."act:list"]
description = "[act] List the workflows/jobs act can run"
run = "act -l"

[tasks."act:videos:update"]
description = "[act] Run update-videos.yml locally (starts Docker if needed, cleans up after; no commit/push/issue)"
run = '''scripts/docker.sh run -- fnox exec -- sh -c 'act workflow_dispatch -W .github/workflows/update-videos.yml ${YOUTUBE_API_KEY:+-s YOUTUBE_API_KEY}' '''

[tasks."act:videos:rebuild"]
description = "[act] Run rebuild-videos.yml locally (starts Docker if needed, cleans up after; no commit/push/issue)"
run = '''scripts/docker.sh run -- fnox exec -- sh -c 'act workflow_dispatch -W .github/workflows/rebuild-videos.yml ${YOUTUBE_API_KEY:+-s YOUTUBE_API_KEY}' '''

[tasks."act:method:set"]
description = "[act] Set a method in .vars (what act:videos:* uses): `mise run act:method:set -- master-list ytdlp|youtube_api|unset`"
run = "scripts/method.sh act set"

[tasks."act:method:show"]
description = "[act] Show the methods set in .vars"
run = "scripts/method.sh act show"

# ---- gh: trigger the real workflows on GitHub ----------------------------
# Uses the current branch unless REF is set (REF=main mise run gh:videos:update).
# The workflow file must exist on the default branch to be dispatchable, and the
# ref must be pushed. The run really commits to that ref and creates issues.

[tasks."gh:videos:update"]
description = "[gh] Trigger the REAL update-videos workflow on GitHub and watch it"
run = '''
ref="${REF:-$(git branch --show-current)}"
gh workflow run update-videos.yml --ref "$ref"
sleep 5
gh run watch --exit-status "$(gh run list --workflow update-videos.yml --branch "$ref" --limit 1 --json databaseId -q '.[0].databaseId')"
'''

[tasks."gh:videos:rebuild"]
description = "[gh] Trigger the REAL rebuild-videos workflow on GitHub and watch it"
run = '''
ref="${REF:-$(git branch --show-current)}"
gh workflow run rebuild-videos.yml --ref "$ref"
sleep 5
gh run watch --exit-status "$(gh run list --workflow rebuild-videos.yml --branch "$ref" --limit 1 --json databaseId -q '.[0].databaseId')"
'''

[tasks."gh:method:set"]
description = "[gh] Set a method as a REPOSITORY VARIABLE used by the real workflows: `mise run gh:method:set -- master-list ytdlp|youtube_api|unset`"
run = "scripts/method.sh gh set"

[tasks."gh:method:show"]
description = "[gh] Show the methods set as repository variables"
run = "scripts/method.sh gh show"

[tasks."gh:list"]
description = "[gh] List recent workflow runs on GitHub"
run = "gh run list --limit 10"
