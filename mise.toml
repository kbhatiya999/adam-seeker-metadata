# Task names: <where>:<area>:<action>
#   local: run the code directly on this machine
#   act:   run the GitHub workflow locally in Docker via act (never commits/pushes/creates issues)
#   gh:    trigger the REAL workflow on GitHub (it commits, pushes and opens/comments on issues)

[tools]
python = "3.12"
uv = "latest"
act = "latest"
fnox = "latest"
age = "latest"    # age-keygen, for the keys of the encrypted secrets (scripts/secrets.py); CI does not need it
gh = "latest"
gcloud = "latest"
tilt = "latest"

[env]
# gcloud's installer needs Python 3.10+; use mise's Python instead of the macOS system one
CLOUDSDK_PYTHON = "{{ get_env(name='MISE_DATA_DIR', default=env.HOME ~ '/.local/share/mise') }}/installs/python/3.12/bin/python"

[tasks.install]
description = "Full first-time setup: install tools (incl. gcloud), sync Python deps, check Docker (offers to install it)"
depends = ["setup"]
run = ["scripts/ensure_gcloud.sh", "scripts/check_docker.sh"]

[tasks.nuke]
description = "Opposite of install: remove .venv, .act, Docker containers/volumes/image for this project (flags: --all, --yes, --dry-run; e.g. `mise run nuke -- --dry-run`)"
run = "scripts/nuke.sh"

[tasks.menu]
description = "Interactive terminal UI: pick where to run (local/act/gh), what to run and its options"
run = "uv run seeker-tui"
interactive = true

[tasks.test]
description = "Run all tests (SDKs, CLI, and the TUI flows with Textual's headless pilot)"
run = "uv run pytest"

[tasks."build:sdks"]
description = "Build every SDK in sdks/ as its own wheel (seeker_sdk_*.whl) into dist/sdks and verify them in clean venvs (flags after --: --sdist, --no-verify)"
run = "scripts/build_packages.sh sdks"

[tasks."build:apps"]
description = "Build the apps (seeker-cli, seeker-tui) as wheels into dist/apps and verify them (flags after --: --sdist, --no-verify)"
run = "scripts/build_packages.sh apps"

[tasks."local:workspace:graph"]
description = "[local] Print the workspace graph: SDKs, apps and services, who depends on whom, which plugins each provides (flags after --: --json, --mermaid)"
run = "uv run --no-project python scripts/workspace_graph.py"

[tasks."local:tilt:up"]
description = "[local] Start the Tilt dashboard (default http://localhost:10350, TILT_PORT to change): tests per package in dependency order, plugin registry, data reports, buttons for update/act/build"
run = "tilt up"
interactive = true

[tasks."local:tilt:ci"]
description = "[local] Run the Tiltfile once without the UI: every automatic resource, exit code 0 only if all succeed (checks the Tiltfile itself)"
run = "tilt ci --port 0 --timeout 10m"

[tasks."sdk:new"]
description = "Scaffold a new SDK: `mise run sdk:new -- rag [--plugin video_sources|transcript_methods]`"
run = "uv run python scripts/new_sdk.py"

[tasks.setup]
description = "Install Python dependencies into .venv"
run = "uv sync --all-packages"

[tasks."setup:cli"]
description = "Install only what the seeker CLI needs (the GitHub workflows use this, so they never download the chat app's dependencies)"
run = "uv sync --package seeker-cli"

# ---- local: run the scripts directly -------------------------------------

[tasks."local:apikey:setup"]
description = "[local] Guided YouTube API key setup: opens the console, validates your key, saves it encrypted in fnox.toml (then offers to publish it to main)"
run = "scripts/api_key.sh"

[tasks."local:videos:update"]
description = "[local] Fetch new videos and update data/videos_master.json"
run = "scripts/fx.sh uv run seeker videos update"

[tasks."local:videos:rebuild"]
description = "[local] Rebuild the master list from scratch"
run = "scripts/fx.sh uv run seeker videos rebuild --force"

[tasks."local:videos:manage"]
description = "[local] Manage/categorize videos (pass a subcommand, e.g. `mise run local:videos:manage report`)"
run = "scripts/fx.sh uv run seeker videos manage"

[tasks."local:transcripts:manage"]
description = "[local] Download/manage transcripts (e.g. `mise run local:transcripts:manage -- --method ytdlp download-missing --limit 5`; subcommands: stats, list-missing, download-missing, download, check)"
run = "scripts/fx.sh uv run seeker transcripts"

[tasks."local:profile:show"]
description = "[local] Show the active fnox profile stack, the effective settings, which secrets are set (never their values) and the profiles you can pick"
run = "python3 scripts/fnox_profile.py show"

[tasks."local:profile:use"]
description = "[local] Pick the fnox profiles every task uses (later ones win): `-- ytdlp gemini-lite`; no names = the default profile"
run = "python3 scripts/fnox_profile.py use"

[tasks."local:method:set"]
description = "[local] Set a method in fnox.local.toml: `mise run local:method:set -- master-list ytdlp|youtube_api|unset` or `-- transcript ytdlp|youtube_transcript_api|unset`"
run = "scripts/method.sh local set"

[tasks."all:method:show"]
description = "[all] Show the methods set in every place at once: local (fnox.local.toml), act (.vars) and gh (repository variables)"
run = "scripts/method.sh all show"

[tasks."local:method:show"]
description = "[local] Show the methods set in fnox.local.toml"
run = "scripts/method.sh local show"

[tasks."local:transcripts:download"]
description = "[local] Download a few transcripts through a network, the same way act and gh do: `-- [direct|proxy|cookies|proxy+cookies] [ytdlp|youtube_transcript_api] [LIMIT]` (the proxy and cookies come from the encrypted `proxy` and `cookies` profiles in fnox.toml)"
run = "scripts/transcripts_run.sh local"

[tasks."local:transcripts:compare"]
description = "[local] Download one video's transcript with BOTH methods side by side: `mise run local:transcripts:compare -- VIDEO_ID` (files under data/transcripts/compare/<id>/)"
run = "scripts/fx.sh uv run seeker transcripts compare"

[tasks."local:knowledge:manage"]
description = "[local] Processing strategies (transcripts -> passages): `-- strategies`, `-- process --strategy english-notes --videos ID1,ID2`, `-- status`. Exit 75 = waiting for model answers: answer data/llm/queue/pending, run again"
run = "scripts/fx.sh uv run seeker knowledge"

[tasks."local:chat:ask"]
description = "[local] Ask a question from processed videos: `-- \"question\" --processing english-notes --chat multilingual [--videos ID1,ID2]`"
run = "scripts/fx.sh uv run seeker ask"

[tasks."local:eval:manage"]
description = "[local] Evaluate strategy pairs on eval/questions: `-- run --processing english-notes --chat keyword --videos ID1,ID2`, `-- compare`, `-- questions --videos ...`"
run = "scripts/fx.sh uv run seeker eval"

[tasks."local:chat:up"]
description = "[local] Start the chat app (Chainlit) at http://localhost:8000 (SEEKER_CHAT_PORT to change): pick a strategy pair, ask, answers cite video and time. Each user gives their own Gemini key in the browser"
run = "uv run seeker-chat"
interactive = true

[tasks."local:apikey:gemini"]
description = "[local] Gemini API key for --provider gemini (the daily processing run): opens Google AI Studio, checks the key, saves it encrypted in fnox.toml (`-- --check` re-checks the saved one)"
run = "scripts/gemini_key.sh"
interactive = true

[tasks."local:secrets:check"]
description = "[local] Encrypted secrets (age, in fnox.toml): the recipients, your personal key, and which secrets this machine can decrypt (never the values)"
run = "python3 scripts/secrets.py check"

[tasks."local:secrets:init"]
description = "[local] Use (or make) your personal age key (~/.config/fnox/age.txt) and make it the `personal` recipient in fnox.toml"
run = "python3 scripts/secrets.py init"

[tasks."local:secrets:ci-key"]
description = "[local] Make a NEW CI age key: sets the GitHub secret FNOX_AGE_KEY, makes it the `ci` recipient, re-encrypts every secret (then publish)"
run = "python3 scripts/secrets.py ci-key"
interactive = true

[tasks."local:secrets:migrate"]
description = "[local] One time: move the secret values still in fnox.local.toml into fnox.toml, encrypted (settings stay local)"
run = "python3 scripts/secrets.py migrate"

[tasks."local:secrets:publish"]
description = "[local] Commit fnox.toml (encrypted values only) and push it straight to main, so act and GitHub get the new secrets (`-- --yes` asks nothing)"
run = "python3 scripts/secrets.py publish"
interactive = true

[tasks."local:proxy:setup"]
description = "[local] Webshare proxy for transcripts where YouTube blocks you (GitHub runners): asks for the proxy username/password (hidden), tests YouTube through it, saves the `proxy` profile encrypted in fnox.toml (`-- --check` re-tests)"
run = "scripts/proxy_setup.sh"
interactive = true

[tasks."local:cookies:setup"]
description = "[local] YouTube login cookies for yt-dlp (another way past the \"not a bot\" check; use a throwaway Google account): reads them from a browser or an exported cookies.txt, keeps only YouTube/Google ones, saves the `cookies` profile encrypted in fnox.toml (`-- --check` re-tests)"
run = "uv run --no-sync python scripts/cookies_setup.py"
interactive = true

[tasks."local:plugins:list"]
description = "[local] List the installed plugins: video sources, transcript methods, model providers, processing and chat strategies"
run = "uv run seeker plugins"

[tasks."local:llm:manage"]
description = "[local] Model tool queue and cache: `-- status`, `-- pending --tool english_notes`"
run = "uv run seeker llm"

# ---- act: run the workflows locally in Docker ----------------------------

[tasks."docker:start"]
description = "[docker] Start Docker Desktop if installed and wait until ready"
run = "scripts/docker.sh start"

[tasks."docker:stop"]
description = "[docker] Remove this project's containers/volumes, then quit Docker Desktop to free resources"
run = "scripts/docker.sh stop"

[tasks."docker:diagnose"]
description = "[docker] Show host vs Docker allocated/free CPU, memory, disk, and how to change it permanently (read-only)"
run = "scripts/docker_diagnose.sh"

[tasks."docker:cleanup"]
description = "[docker] Remove leftover (orphaned) containers/volumes from this project, keep Docker running"
run = "scripts/docker.sh cleanup"

[tasks."act:list"]
description = "[act] List the workflows/jobs act can run"
run = "act -l"

[tasks."act:videos:update"]
description = "[act] Run update-videos.yml locally (starts Docker if needed, cleans up after; no commit/push/issue)"
run = '''scripts/docker.sh run -- python3 scripts/secrets.py with-key sh -c 'act workflow_dispatch -W .github/workflows/update-videos.yml ${FNOX_AGE_KEY:+-s FNOX_AGE_KEY}' '''

[tasks."act:videos:rebuild"]
description = "[act] Run rebuild-videos.yml locally (starts Docker if needed, cleans up after; no commit/push/issue)"
run = '''scripts/docker.sh run -- python3 scripts/secrets.py with-key sh -c 'act workflow_dispatch -W .github/workflows/rebuild-videos.yml ${FNOX_AGE_KEY:+-s FNOX_AGE_KEY}' '''

[tasks."act:transcripts:download"]
description = "[act] Run download-transcripts.yml locally in Docker, same arguments as local: `-- [direct|proxy|cookies|proxy+cookies] [ytdlp|youtube_transcript_api] [LIMIT]` (act gets your personal age key as FNOX_AGE_KEY; nothing published)"
run = "scripts/docker.sh run -- scripts/transcripts_run.sh act"

[tasks."act:method:set"]
description = "[act] Set a method in .vars (what act:videos:* uses): `mise run act:method:set -- master-list ytdlp|youtube_api|unset`"
run = "scripts/method.sh act set"

[tasks."act:method:show"]
description = "[act] Show the methods set in .vars"
run = "scripts/method.sh act show"

# ---- gh: trigger the real workflows on GitHub ----------------------------
# Uses the current branch unless REF is set (REF=main mise run gh:videos:update).
# The workflow file must exist on the default branch to be dispatchable, and the
# ref must be pushed. The run really commits to that ref and creates issues.

[tasks."gh:videos:update"]
description = "[gh] Trigger the REAL update-videos workflow on GitHub and watch it"
run = '''
ref="${REF:-$(git branch --show-current)}"
gh workflow run update-videos.yml --ref "$ref"
sleep 5
gh run watch --exit-status "$(gh run list --workflow update-videos.yml --branch "$ref" --limit 1 --json databaseId -q '.[0].databaseId')"
'''

[tasks."gh:videos:rebuild"]
description = "[gh] Trigger the REAL rebuild-videos workflow on GitHub and watch it"
run = '''
ref="${REF:-$(git branch --show-current)}"
gh workflow run rebuild-videos.yml --ref "$ref"
sleep 5
gh run watch --exit-status "$(gh run list --workflow rebuild-videos.yml --branch "$ref" --limit 1 --json databaseId -q '.[0].databaseId')"
'''

[tasks."gh:transcripts:download"]
description = "[gh] Trigger the download-transcripts workflow on GitHub and watch it, same arguments as local: `-- [direct|proxy|cookies|proxy+cookies] [ytdlp|youtube_transcript_api] [LIMIT]` (the runner decrypts fnox.toml with the FNOX_AGE_KEY secret; commits nothing, the transcripts come back as the run's artifact)"
run = "scripts/transcripts_run.sh gh"

[tasks."gh:method:set"]
description = "[gh] Set a method as a REPOSITORY VARIABLE used by the real workflows: `mise run gh:method:set -- master-list ytdlp|youtube_api|unset`"
run = "scripts/method.sh gh set"

[tasks."gh:method:show"]
description = "[gh] Show the methods set as repository variables"
run = "scripts/method.sh gh show"

[tasks."gh:list"]
description = "[gh] List recent workflow runs on GitHub"
run = "gh run list --limit 10"
