[project]
name = "seeker-tui"
version = "0.1.0"
description = "Terminal menu (Textual) over the mise tasks: pick where to run, what to run and its options"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["textual>=8.2.8"]

[project.scripts]
seeker-tui = "seeker_tui.app:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"
