[project]
name = "seeker-sdk-knowledge"
version = "0.1.0"
description = "Seeker SDK knowledge: processing strategies (transcripts -> searchable passages), text-file store"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "seeker-sdk-core>=0.1.0",
    "seeker-sdk-llm>=0.1.0",
    "seeker-sdk-transcripts>=0.1.0",
]

[project.entry-points."seeker.processing_strategies"]
chunks = "seeker_sdk_knowledge.strategies:ChunksStrategy"
english-notes = "seeker_sdk_knowledge.strategies:EnglishNotesStrategy"

[tool.uv.sources]
seeker-sdk-core = { workspace = true }
seeker-sdk-llm = { workspace = true }
seeker-sdk-transcripts = { workspace = true }

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"
