[project]
name = "seeker-sdk-eval"
version = "0.1.0"
description = "Seeker SDK eval: evaluation questions, scoring and comparison of strategy pairs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "seeker-sdk-core>=0.1.0",
    "seeker-sdk-llm>=0.1.0",
    "seeker-sdk-knowledge>=0.1.0",
    "seeker-sdk-chat>=0.1.0",
]

[tool.uv.sources]
seeker-sdk-core = { workspace = true }
seeker-sdk-llm = { workspace = true }
seeker-sdk-knowledge = { workspace = true }
seeker-sdk-chat = { workspace = true }

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"
