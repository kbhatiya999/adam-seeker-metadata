[project]
name = "seeker-workspace"
version = "0.1.0"
description = "Adam Seeker metadata workspace: SDKs (reusable libraries), apps (CLI, TUI) and, later, services"
requires-python = ">=3.11"
dependencies = [
    "seeker-cli",
    "seeker-tui",
]

[tool.uv]
package = false

# Everything under these folders is a workspace member. Add a new SDK with `mise run sdk:new -- <name>`.
[tool.uv.workspace]
members = ["sdks/*", "apps/*", "services/*"]

[tool.uv.sources]
seeker-sdk-core = { workspace = true }
seeker-sdk-videos = { workspace = true }
seeker-sdk-transcripts = { workspace = true }
seeker-cli = { workspace = true }
seeker-tui = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["sdks", "apps", "services"]
addopts = "-q"
