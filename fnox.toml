# Secrets and settings for local runs, act and CI (fnox). Secret VALUES are stored here only ENCRYPTED (age): write them
# with the helpers or `mise run local:secrets:...` (scripts/secrets.py), never by hand, never as a plain `default`.
# Two keys decrypt: your personal one (~/.config/fnox/age.txt, also used by act) and the CI one (GitHub secret
# FNOX_AGE_KEY). Without a key fnox passes an already-set env var through (a fork's plain YOUTUBE_API_KEY secret).
# Your own settings: fnox.local.toml (git-ignored; see fnox.local.toml.example).

[providers.age]
type = "age"
# Two keys can read the secrets below: `personal` (~/.config/fnox/age.txt, also used by act) and `ci`
# (only in the GitHub secret FNOX_AGE_KEY). Change them with: mise run local:secrets:init / ci-key
recipients = [
  "age1snu433upwrts5jaj06utvnxafv2mvsw02rp8hk63tyypqyujxa5sk8rwd0", # personal
  "age1ucxm2evrdy6jv6xv7scedunlam5y6vtukkk8pqcxcqhznwwnh9tqpt2tct", # ci
]

[secrets.YOUTUBE_API_KEY]
description = "YouTube Data API v3 key (optional; falls back to yt-dlp when unset)"
if_missing = "warn"
provider = "age"
value = ""

# Optional transcript settings (scripts/transcripts.py); unset is fine.
[secrets.TRANSCRIPT_METHOD]
description = "ytdlp or youtube_transcript_api (no default, no fallback)"
if_missing = "ignore"

[secrets.YTDLP_COOKIES_BASE64]
description = "The cookies.txt for yt-dlp as ONE base64 line (made by `mise run local:cookies:setup`; the same name in the local profile, act and the GitHub secret)"
if_missing = "ignore"

[secrets.PROXY_URL]
description = "Generic proxy URL, e.g. http://user:pass@host:port (optional)"
if_missing = "ignore"

[secrets.WEBSHARE_PROXY_USERNAME]
description = "Webshare proxy username for youtube-transcript-api (optional)"
if_missing = "ignore"

[secrets.WEBSHARE_PROXY_PASSWORD]
description = "Webshare proxy password for youtube-transcript-api (optional)"
if_missing = "ignore"

[secrets.MASTER_LIST_METHOD]
description = "youtube_api or ytdlp for discovering videos (unset = API if a key is present, else yt-dlp)"
if_missing = "ignore"

[secrets.TRANSCRIPT_FORMAT]
description = "Format yt-dlp downloads: ttml (default), srv1, srt or vtt"
if_missing = "ignore"

[secrets.TRANSCRIPT_FINAL]
description = "Final transcript files, comma separated from srt,vtt,txt (default srt,txt)"
if_missing = "ignore"

# Gemini key (Google AI Studio) for model tools run with --provider gemini: mise run local:apikey:gemini.
# The chat app does not use it; each user gives their own key in the browser.
[secrets.GEMINI_API_KEY]
description = "Gemini API key from Google AI Studio (aistudio.google.com/apikey)"
if_missing = "ignore"
provider = "age"
value = ""

# Optional settings for the model tools (set them in fnox.local.toml):
# which provider runs tools by default (queue | gemini) and which Gemini model (each has its own free daily quota).
[secrets.SEEKER_LLM_PROVIDER]
description = "Default provider for seeker knowledge/ask/eval: queue or gemini"
if_missing = "ignore"

[secrets.SEEKER_GEMINI_MODEL]
description = "Gemini model for --provider gemini (default gemini-flash-latest)"
if_missing = "ignore"

# ---- Profiles: named bundles of SETTINGS (readable), plus the encrypted network profiles `proxy` and `cookies` ------
# The keys sit encrypted at the top of this file and every profile inherits them. Stack one methods profile and one
# model profile, e.g. `ytdlp,gemini-lite`:  mise run local:profile:use -- ytdlp gemini-lite  (or Tilt / the menu).
# Every mise task runs through scripts/fx.sh, which passes the active stack to fnox. Your own tweaks
# (`mise run local:method:set ...`) go to the local `overrides` profile in fnox.local.toml, applied last.
# Precedence (tested with fnox 1.39): the local file beats this one, and a profile beats the top level of the same
# file. So never put SETTINGS at the top of fnox.local.toml: they would silently beat every profile.
[profiles.youtube-api.secrets]
MASTER_LIST_METHOD = { default = "youtube_api" }
TRANSCRIPT_METHOD = { default = "youtube_transcript_api" }

[profiles.ytdlp.secrets]
MASTER_LIST_METHOD = { default = "ytdlp" }
TRANSCRIPT_METHOD = { default = "ytdlp" }

[profiles.subagents.secrets]
SEEKER_LLM_PROVIDER = { default = "queue" }

[profiles.gemini.secrets]
SEEKER_LLM_PROVIDER = { default = "gemini" }
SEEKER_GEMINI_MODEL = { default = "gemini-flash-latest" }

[profiles.gemini-lite.secrets]
SEEKER_LLM_PROVIDER = { default = "gemini" }
SEEKER_GEMINI_MODEL = { default = "gemini-flash-lite-latest" }

[profiles.proxy]

[profiles.proxy.secrets]
WEBSHARE_PROXY_USERNAME= { provider = "age", value = "" }
WEBSHARE_PROXY_PASSWORD= { provider = "age", value = "" }
PROXY_URL= { provider = "age", value = "" }
